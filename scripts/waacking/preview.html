<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Waacking playback review</title>
<link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
<style>body{margin:0;background:#20242b;color:white}header{height:54px;font-size:14px}canvas{display:block;width:100vw;height:calc(100vh - 54px)}#labels{position:absolute;inset:54px 0 0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);pointer-events:none}.clip-label{padding:8px;font-size:12px}#time{width:260px}#view{width:100px}#status{margin-left:auto}</style>
</head><body>
<header class="d-flex align-items-center gap-3 p-2 bg-dark">
<button id="play" class="btn btn-light btn-sm">Pause</button>
<label class="d-flex align-items-center gap-2">Time <input id="time" type="range" min="0" max="4" step="0.125" value="0"></label>
<output id="seconds">0.00 s</output>
<select id="view" class="form-select form-select-sm"><option value="front">Front</option><option value="side">Side</option><option value="back">Back</option></select>
<span id="status">Loading MPFB models</span></header>
<canvas></canvas><div id="labels"></div><script type="module" src="./preview.js"></script>
</body></html>
